services:
  postgres:
    image: postgres:16

    container_name: scooter-rental-postgres

    environment:
      POSTGRES_DB: scooter_rental_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5433:5432"

    volumes:
      - scooter_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d scooter_rental_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .

    container_name: scooter-rental-app

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/scooter_rental_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres

    ports:
      - "8080:8080"

volumes:
  scooter_postgres_data: