services:
  postgres:
    image: postgres:16

    container_name: scooter-rental-postgres

    environment:
      POSTGRES_DB: scooter_rental_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5433:5432"

    volumes:
      - scooter_postgres_data:/var/lib/postgresql/data

volumes:
  scooter_postgres_data: